# One-command local stack for podman-compose. Cluster components deploy via their Helm charts.
# Secrets come from .env (run `make init` once to generate them). Nothing here is published beyond localhost.
services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sif
      POSTGRES_USER: sif
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sif-local-dev}
    volumes:
      - sif-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sif -d sif"]
      interval: 3s
      retries: 20

  portal-api:
    build:
      context: .
      dockerfile: components/portal-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sif:${POSTGRES_PASSWORD:-sif-local-dev}@postgres:5432/sif
      SIF_INGEST_TOKEN: ${SIF_INGEST_TOKEN:-}
      SIF_HANDLING_MAX_CHARS: ${SIF_HANDLING_MAX_CHARS:-4000}
      SIF_SECRET_KEY: ${SIF_SECRET_KEY:-}  # encrypts the connection tokens saved on the Connections page; run `make init`
      SIF_INTERNAL_TOKEN: ${SIF_INTERNAL_TOKEN:-}  # lets jira-connector, git-broker and context-ingest read a team's credentials
      SIF_DASHBOARD_TOKEN: ${SIF_DASHBOARD_TOKEN:-}  # people's decisions (approvals, teams, knowledge, kills); held by portal-web only
      SIF_SECRET_KEYS_OLD: ${SIF_SECRET_KEYS_OLD:-}  # previous SIF_SECRET_KEY values while rotating (docs/security.md)
      SIF_LESSON_AUTO_APPROVE: ${SIF_LESSON_AUTO_APPROVE:-true}  # production requires false: a person approves every lesson
      SIF_RETENTION_DAYS: ${SIF_RETENTION_DAYS:-}  # delete event payloads of finished tasks after this many days; 0 = keep
      SIF_MAX_CONCURRENT_PER_TEAM: ${SIF_MAX_CONCURRENT_PER_TEAM:-0}  # per-team limits: jira-connector reads them from GET /api/intake
      SIF_MAX_TASKS_PER_TEAM_PER_DAY: ${SIF_MAX_TASKS_PER_TEAM_PER_DAY:-25}
      SIF_AUDIT_RETENTION_DAYS: ${SIF_AUDIT_RETENTION_DAYS:-}
      SIF_ENV: ${SIF_ENV:-}  # production = refuse to start with unsafe settings (sif_contracts.posture)
      GIT_BROKER_URL: http://git-broker:8080  # repository safety on the Teams page
      JIRA_CONNECTOR_URL: http://jira-connector:8080  # answers typed on the 3D view are posted on Jira from there
      SIF_ALLOW_PRIVATE_URLS: ${SIF_ALLOW_PRIVATE_URLS:-false}
      TEMPORAL_ADDRESS: temporal:7233  # saving a team registers its namespace
      # self-improvement (docs/self-improvement.md)
      SIF_IMPROVE_MINUTES: ${SIF_IMPROVE_MINUTES:-60}
      SIF_LESSON_HOLDOUT_PCT: ${SIF_LESSON_HOLDOUT_PCT:-20}
      SIF_EVAL_BUDGET_USD: ${SIF_EVAL_BUDGET_USD:-1.0}
      SIF_EVAL_MAX_CASES: ${SIF_EVAL_MAX_CASES:-20}
      SIF_EVAL_AUTO: ${SIF_EVAL_AUTO:-false}
      SIF_DIGEST_HOURS: ${SIF_DIGEST_HOURS:-24}
      SIF_DIGEST_FILE: ${SIF_DIGEST_FILE:-CLAUDE.md}
    depends_on:
      - postgres
      - temporal
    ports:
      - "127.0.0.1:8000:8000"

  injection-guard:
    build:
      context: .
      dockerfile: components/injection-guard/Dockerfile
    # No published port: only other services on the compose network call it.

  embeddings:
    build:
      context: .
      dockerfile: components/embeddings/Dockerfile
    environment:
      EMBEDDINGS_BACKEND: ${EMBEDDINGS_BACKEND:-fastembed}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDINGS_MODEL_PATH: ${EMBEDDINGS_MODEL_PATH:-}  # a pre-downloaded model directory, to run with no internet
      EMBEDDINGS_FALLBACK: ${EMBEDDINGS_FALLBACK:-}  # 'hash' = keep going on the offline fallback if the model cannot load
    volumes:
      - sif-embed-models:/models
    # No published port. The first start downloads the model once from huggingface.co (set EMBEDDINGS_BACKEND=hash to run fully offline).

  context-api:
    build:
      context: .
      dockerfile: components/context-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sif:${POSTGRES_PASSWORD:-sif-local-dev}@postgres:5432/sif
      EMBEDDINGS_URL: http://embeddings:8080
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      PORTAL_API_URL: http://portal-api:8000
    depends_on:
      - postgres
      - embeddings
      - portal-api
    ports:
      - "127.0.0.1:8090:8080"

  context-ingest:
    build:
      context: .
      dockerfile: components/context-ingest/Dockerfile
    environment:
      DATABASE_URL: postgresql://sif:${POSTGRES_PASSWORD:-sif-local-dev}@postgres:5432/sif
      EMBEDDINGS_URL: http://embeddings:8080
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      PORTAL_API_URL: http://portal-api:8000
      SIF_INGEST_TOKEN: ${SIF_INGEST_TOKEN:-}
      SIF_INTERNAL_TOKEN: ${SIF_INTERNAL_TOKEN:-}
      SIF_CONTEXT_SYNC_MINUTES: ${SIF_CONTEXT_SYNC_MINUTES:-60}
      SIF_PR_HISTORY_COUNT: ${SIF_PR_HISTORY_COUNT:-100}
      SIF_REVIEW_MIN_COUNT: ${SIF_REVIEW_MIN_COUNT:-2}
      # Read-only access is enough. Confluence reuses the Jira site and token unless CONFLUENCE_* are set.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    depends_on:
      - postgres
      - embeddings
      - portal-api
    ports:
      - "127.0.0.1:8091:8080"

  temporal:
    image: docker.io/temporalio/temporal:1.9.1
    # The UI is served under /temporal so the dashboard can proxy it (read-only) and link to it from its own Workflows pages.
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db", "--ui-public-path", "/temporal", "--ui-disable-news-fetch"]
    volumes:
      - sif-temporal-data:/data
    # Development server (one process, SQLite). For production use the Temporal Helm chart with Postgres.

  sandbox-gateway:
    build:
      context: .
      dockerfile: components/sandbox-gateway/Dockerfile
    environment:
      SIF_INTERNAL_TOKEN: ${SIF_INTERNAL_TOKEN:-}
      SIF_INGEST_TOKEN: ${SIF_INGEST_TOKEN:-}
      TEMPORAL_ADDRESS: temporal:7233
      GIT_BROKER_URL: http://git-broker:8080
      CONTEXT_API_URL: http://context-api:8080
      PORTAL_API_URL: http://portal-api:8000
      LLM_UPSTREAM_URL: ${LLM_UPSTREAM_URL:-}
      LLM_UPSTREAM_KEY: ${LLM_UPSTREAM_KEY:-}
      LLM_UPSTREAM_AUTH: ${LLM_UPSTREAM_AUTH:-bearer}
      SIF_ALLOWED_MODELS: ${SIF_ALLOWED_MODELS:-}
      SIF_PRICE_TABLE: ${SIF_PRICE_TABLE:-}
      SIF_QA_REUSE_SIM: ${SIF_QA_REUSE_SIM:-0.8}
    depends_on:
      - temporal
    networks:
      - default
      - sandboxes  # the only service on both: sandboxes can reach it and nothing else

  sandbox-provisioner:
    build:
      context: .
      dockerfile: components/sandbox-provisioner/Dockerfile
    # Local development only: it controls sibling containers through the Podman socket, which is powerful. Keep it off shared machines.
    # In a cluster use SIF_SANDBOX_BACKEND=kubernetes with a service account limited to pods in the sandbox namespace.
    user: root  # root inside the container is your normal user under rootless Podman, which is what owns the socket
    security_opt:
      - label=disable
    environment:
      SIF_INTERNAL_TOKEN: ${SIF_INTERNAL_TOKEN:-}
      SIF_SANDBOX_BACKEND: ${SIF_SANDBOX_BACKEND:-podman}
      SIF_SANDBOX_NETWORK: sif-sandboxes
      SIF_PODMAN_RUNTIME: ${SIF_PODMAN_RUNTIME:-}  # runsc = gVisor, when installed in the Podman VM
    volumes:
      - ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock
    # Not on the sandboxes network: it holds the Podman socket, so no sandbox may reach it. It attaches sandboxes through the API.

  git-broker:
    build:
      context: .
      dockerfile: components/git-broker/Dockerfile
    environment:
      SIF_INTERNAL_TOKEN: ${SIF_INTERNAL_TOKEN:-}
      PORTAL_API_URL: http://portal-api:8000  # a team's own GitHub token comes from here
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}  # shared token for teams without their own connection
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}  # a GitHub App instead of the shared token: one short-lived token per repository
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}  # PEM; or mount the file and set GITHUB_APP_PRIVATE_KEY_PATH (path inside the container)
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      SIF_REQUIRE_PROTECTED_BRANCH: ${SIF_REQUIRE_PROTECTED_BRANCH:-}  # refuse branches without a required review (default: on in production)
      SIF_ALLOW_DEPENDENCY_CHANGES: ${SIF_ALLOW_DEPENDENCY_CHANGES:-false}
      SIF_MAX_CHANGED_FILES: ${SIF_MAX_CHANGED_FILES:-50}
      SIF_MAX_CHANGED_LINES: ${SIF_MAX_CHANGED_LINES:-3000}
      SIF_TRUSTED_ASSOCIATIONS: ${SIF_TRUSTED_ASSOCIATIONS:-OWNER,MEMBER,COLLABORATOR}
      SIF_ENV: ${SIF_ENV:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GIT_REMOTE_BASE: ${GIT_REMOTE_BASE:-https://github.com}
      SIF_PROTECTED_PATHS: ${SIF_PROTECTED_PATHS:-.github/workflows/**,CODEOWNERS,.github/CODEOWNERS,.sif/**}
    volumes:
      - sif-git-data:/data

  orchestrator-worker:
    build:
      context: .
      dockerfile: components/orchestrator-worker/Dockerfile
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      SIF_INTERNAL_TOKEN: ${SIF_INTERNAL_TOKEN:-}
      SIF_INGEST_TOKEN: ${SIF_INGEST_TOKEN:-}
      PORTAL_API_URL: http://portal-api:8000
      SANDBOX_GATEWAY_URL: http://sandbox-gateway:8080
      SANDBOX_URL_FOR_AGENT: http://sandbox-gateway:8080
      SANDBOX_PROVISIONER_URL: http://sandbox-provisioner:8080
      GIT_BROKER_URL: http://git-broker:8080
      CONTEXT_API_URL: http://context-api:8080
      SIF_SANDBOX_IMAGE: localhost/sif-agent-runner:latest
      SIF_AGENT: ${SIF_AGENT:-scripted}
      SIF_PROFILE: ${SIF_PROFILE:-cheap-best}
      MODEL_IMPLEMENTATION: ${MODEL_IMPLEMENTATION:-claude-haiku-5-5}
      SIF_KILL_POLL_SECONDS: ${SIF_KILL_POLL_SECONDS:-5}
      SIF_DIGEST_FILE: ${SIF_DIGEST_FILE:-CLAUDE.md}
      SIF_DIGEST_POLL_SECONDS: ${SIF_DIGEST_POLL_SECONDS:-300}
    depends_on:
      - temporal
      - portal-api

  jira-connector:
    build:
      context: .
      dockerfile: components/jira-connector/Dockerfile
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      PORTAL_API_URL: http://portal-api:8000
      SIF_INGEST_TOKEN: ${SIF_INGEST_TOKEN:-}
      SIF_INTERNAL_TOKEN: ${SIF_INTERNAL_TOKEN:-}  # a team's own Jira connection comes from portal-api
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      SIF_DRY_RUN: ${SIF_DRY_RUN:-true}  # logs what it would do until you turn it off
      SIF_POLL_SECONDS: ${SIF_POLL_SECONDS:-30}
      SIF_LABEL_TRIGGER: ${SIF_LABEL_TRIGGER:-sif}
      SIF_LABEL_PICKED: ${SIF_LABEL_PICKED:-sif-picked}
      SIF_LABEL_TIMED_OUT: ${SIF_LABEL_TIMED_OUT:-sif-timed-out}
      SIF_MENTION: ${SIF_MENTION:-@sif}
      SIF_BOT_ACCOUNT_ID: ${SIF_BOT_ACCOUNT_ID:-}
      SIF_MAX_BUDGET_USD: ${SIF_MAX_BUDGET_USD:-2.0}
      SIF_BUDGET_EXTENSION_USD: ${SIF_BUDGET_EXTENSION_USD:-2.0}
      SIF_WAIT_TIMEOUT_MINUTES: ${SIF_WAIT_TIMEOUT_MINUTES:-120}
      SIF_MAX_RUN_MINUTES: ${SIF_MAX_RUN_MINUTES:-240}
      SIF_MAX_CONCURRENT_TASKS: ${SIF_MAX_CONCURRENT_TASKS:-5}
      SIF_ALLOWED_JIRA_PROJECTS: ${SIF_ALLOWED_JIRA_PROJECTS:-}
      SIF_RESPONDERS: ${SIF_RESPONDERS:-}
      SIF_MAINTAINERS: ${SIF_MAINTAINERS:-}
      SIF_TEAM_LEADS: ${SIF_TEAM_LEADS:-}
      SIF_ADMINS: ${SIF_ADMINS:-}
      SIF_JIRA_TYPE_MAP: "${SIF_JIRA_TYPE_MAP:-epic:epic,story:story,task:task,bug:task,sub-task:task,subtask:task,feature:feature,new feature:feature}"
      SIF_HANDLING_MAX_REVISIONS: ${SIF_HANDLING_MAX_REVISIONS:-3}
    depends_on:
      - temporal
      - portal-api

  agent-runner-image:  # build-only: produces the image the provisioner starts for each task, then exits
    image: localhost/sif-agent-runner:latest
    build:
      context: .
      dockerfile: components/agent-runner/Dockerfile
      args:
        INSTALL_CLAUDE: ${INSTALL_CLAUDE:-false}  # true adds the Claude Code CLI, which SIF_AGENT=claude needs (Anthropic's terms apply)
    command: ["true"]
    restart: "no"
    networks:
      - default

  portal-web:
    build:
      context: components/portal-web
    environment:
      PORTAL_API_URL: http://portal-api:8000
      CONTEXT_API_URL: http://context-api:8080
      CONTEXT_INGEST_URL: http://context-ingest:8080
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}  # only to link task pages to their tickets
      SIF_INGEST_TOKEN: ${SIF_INGEST_TOKEN:-}
      SIF_AGENT: ${SIF_AGENT:-scripted}  # only to warn on every page while the demo agent is in use
      SIF_AUTH_MODE: ${SIF_AUTH_MODE:-off}  # proxy = require sign-in through auth-proxy (profile "sso")
      SIF_DASHBOARD_TOKEN: ${SIF_DASHBOARD_TOKEN:-}
      SIF_ENV: ${SIF_ENV:-}  # production = no dashboard without sign-in
      SIF_3D_URL: ${SIF_3D_URL:-http://localhost:5173}  # with SSO: /3d/ (the 3d-view-prod service behind auth-proxy)
      SIF_PORTAL_ADMINS: ${SIF_PORTAL_ADMINS:-}  # emails or IdP groups that may change setup (teams, connections, handling)
      SIF_PORTAL_OPERATORS: ${SIF_PORTAL_OPERATORS:-}  # may kill tasks, review lessons and start syncs; everyone else signed in can only look
    depends_on:
      - portal-api
      - context-api
    ports:
      - "127.0.0.1:3000:3000"  # with SSO, remove this line so the dashboard is only reachable through auth-proxy

  # Company sign-in in front of the dashboard: `podman-compose --profile sso up -d`, then open http://localhost:4180. Any OIDC provider
  # (Okta, Entra ID, Google Workspace, Keycloak). Passes the user's email and groups on to portal-web, which maps them to roles.
  auth-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    profiles: ["sso"]
    depends_on:
      - portal-web
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${SSO_ISSUER_URL:-}
      OAUTH2_PROXY_CLIENT_ID: ${SSO_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${SSO_COOKIE_SECRET:-}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${SSO_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: ${SSO_GROUPS_CLAIM:-groups}
      OAUTH2_PROXY_UPSTREAMS: http://portal-web:3000/,http://3d-view-prod:8080/3d/  # the 3D view behind the same sign-in, at /3d/
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: ${SSO_REDIRECT_URL:-http://localhost:4180/oauth2/callback}
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"  # X-Forwarded-Email / -Groups, overwriting anything the browser sent
      OAUTH2_PROXY_COOKIE_SECURE: ${SSO_COOKIE_SECURE:-false}
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    ports:
      - "127.0.0.1:4180:4180"

  # The production 3D view (static build behind nginx, reads only), at http://localhost:4180/3d/ through auth-proxy. With SSO, use this
  # instead of the dev server below, and remove the dev server's port: it serves the event stream to anyone who can reach it.
  3d-view-prod:
    build:
      context: .
      dockerfile: components/3d-view/Dockerfile
    profiles: ["sso"]
    depends_on:
      - portal-api

  3d-view:
    image: docker.io/library/node:22-alpine
    working_dir: /work/components/3d-view
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    depends_on:
      - portal-api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./:/work
      - sif-3d-view-node-modules:/work/components/3d-view/node_modules

networks:
  default: {}
  sandboxes:
    name: sif-sandboxes
    internal: true  # no route to the internet or to anything outside this network

volumes:
  sif-temporal-data:
  sif-git-data:
  sif-embed-models:
  sif-pgdata:
  sif-3d-view-node-modules:
