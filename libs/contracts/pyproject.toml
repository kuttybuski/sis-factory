[project]
name = "sif-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts, settings and pure policy rules for sif services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pydantic-settings>=2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sif_contracts"]
