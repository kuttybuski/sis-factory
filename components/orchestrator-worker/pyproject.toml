[project]
name = "orchestrator-worker"
version = "0.1.0"
description = "Temporal workflows and activities that run a task from Jira ticket to draft pull request"
requires-python = ">=3.12"
dependencies = ["temporalio>=1.7", "httpx>=0.27", "injection-guard", "sis-contracts"]

[tool.uv.sources]
injection-guard = { workspace = true }
sis-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_worker"]
