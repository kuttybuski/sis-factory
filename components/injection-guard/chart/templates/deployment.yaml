apiVersion: apps/v1
kind: Deployment
metadata:
  name: injection-guard
  labels: { app.kubernetes.io/name: injection-guard }
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: injection-guard }
  template:
    metadata:
      labels: { app.kubernetes.io/name: injection-guard }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: injection-guard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.port }}
          {{- with .Values.thresholds }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.port }} }
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.port }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
