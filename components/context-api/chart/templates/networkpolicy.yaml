apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: context-api
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: context-api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.allowFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
  egress:
    - ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    {{- if .Values.databasePort }}
    - ports: [{ protocol: TCP, port: {{ .Values.databasePort }} }]
    {{- end }}
    {{- range .Values.egressPorts }}
    - ports: [{ protocol: TCP, port: {{ . }} }]
    {{- end }}
